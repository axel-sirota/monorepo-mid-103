services:
  postgres:
    image: postgres:16.3-alpine
    container_name: monorepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monorepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monorepo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monorepo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: monorepo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: monorepo-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: monorepo-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlruns.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow

  user-service:
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    container_name: monorepo-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monorepo}:${POSTGRES_PASSWORD:-monorepo}@postgres:5432/users_db
      INFERENCE_GATEWAY_URL: http://inference-gateway:9000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-dev-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: monorepo-notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monorepo}:${POSTGRES_PASSWORD:-monorepo}@postgres:5432/notifications_db?sslmode=disable
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      FROM_EMAIL: noreply@example.com
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: monorepo-api-gateway
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      USER_SERVICE_URL: http://user-service:8001
      NOTIFICATION_SERVICE_URL: http://notification-service:8002
      API_KEY: ${API_GATEWAY_KEY:-dev-key-change-me}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  model-serving:
    build:
      context: ./ml/model-serving
      dockerfile: Dockerfile
    container_name: monorepo-model-serving
    restart: unless-stopped
    environment:
      MODEL_PATH: /models/churn.joblib
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${MODEL_SERVING_PORT:-9001}:9001"
    volumes:
      - models-data:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  inference-gateway:
    build:
      context: ./ml/inference-gateway
      dockerfile: Dockerfile
    container_name: monorepo-inference-gateway
    restart: unless-stopped
    depends_on:
      model-serving:
        condition: service_healthy
    environment:
      MODEL_SERVING_URL: http://model-serving:9001
      API_KEY: ${INFERENCE_API_KEY:-dev-key-change-me}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${INFERENCE_GATEWAY_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  training:
    build:
      context: ./ml/training
      dockerfile: Dockerfile
    container_name: monorepo-training
    profiles: ["training"]   # run with: docker compose --profile training run --rm training
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_OUTPUT_PATH: /models/churn.joblib
    volumes:
      - models-data:/models
    depends_on:
      mlflow:
        condition: service_started

volumes:
  postgres-data:
  mlflow-data:
  models-data:
