[project]
name = "training"
version = "0.1.0"
description = "One-shot churn model training script with MLflow tracking"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "mlflow>=2.18",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
